name = "dingcode-licenses"
main = "worker.js"
compatibility_date = "2026-10-01"

# 1. 创建: wrangler kv namespace create LICENSES
# 2. 把返回的 id 填到下面
kv_namespaces = [
  { binding = "LICENSES", id = "REPLACE_ME" }
]

# secrets（不要写进本文件）:
#   wrangler secret put LICENSE_SECRET     # DGA1 HMAC 密钥
#   wrangler secret put LS_WEBHOOK_SECRET  # Lemon Squeezy webhook 签名密钥
#   wrangler secret put RESEND_API_KEY     # 发件 API key
#   wrangler secret put MAIL_FROM          # 发件人
