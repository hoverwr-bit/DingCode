services:
  dingai-team:
    build:
      context: ..
      dockerfile: team-server/Dockerfile
    ports:
      - "8050:8050"
    environment:
      DINGAI_TEAM_HOST: 0.0.0.0
      DINGAI_TEAM_PORT: "8050"
      DINGAI_TEAM_ROOT: /data
      DINGAI_TEAM_REQUIRE_AUTH: "1"
      # Set this yourself. Do not commit a real token.
      DINGAI_TEAM_ADMIN_TOKEN: ${DINGAI_TEAM_ADMIN_TOKEN:-change-me}
    volumes:
      - dingai-data:/data
volumes:
  dingai-data:
