name: dingai

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Core, handoff, team server, and Linux checks
        working-directory: tools/dingai
        run: |
          python3 -m unittest core.test_core handoff_test linux.test_linux
          python3 -m unittest discover -s team-server -p 'test_*.py'
          node --check web/anno.js
          node web/anno-layout.test.js
          node web/anno-source.test.js
          node --check extension/background.js
          node --check extension/content.js
      - name: Team server image
        run: docker build -f tools/dingai/team-server/Dockerfile -t dingai-team tools/dingai

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build DingAIWin
        run: dotnet build tools/dingai/windows/DingAIWin.csproj -c Release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DingAI
        run: bash tools/dingai/macos/build.sh
