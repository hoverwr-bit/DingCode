name: dingai-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the Python tools
        run: |
          mkdir -p dist
          tar -czf dist/dingai-linux.tar.gz tools/dingai
      - uses: actions/upload-artifact@v4
        with:
          name: dingai-linux
          path: dist/dingai-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DingAI.app
        run: bash tools/dingai/macos/build.sh
      - name: Sign and notarize when Apple secrets are present
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12}" ] || [ -z "${P12_PASSWORD}" ] || [ -z "${APPLE_ID}" ] || [ -z "${APPLE_TEAM_ID}" ] || [ -z "${APPLE_PASSWORD}" ]; then
            echo "Apple signing secrets are not set. Keeping the signature from build.sh."
            exit 0
          fi
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          codesign --force --options runtime --sign "$IDENTITY" tools/dingai/macos/DingAI.app
          ditto -c -k --keepParent tools/dingai/macos/DingAI.app DingAI-mac.zip
          xcrun notarytool submit DingAI-mac.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple tools/dingai/macos/DingAI.app
          rm -f cert.p12 DingAI-mac.zip
      - name: Zip the app
        run: mkdir -p dist && ditto -c -k --keepParent tools/dingai/macos/DingAI.app dist/DingAI-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dingai-mac
          path: dist/DingAI-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish DingAIWin
        run: dotnet publish tools/dingai/windows/DingAIWin.csproj -c Release -o dist/win
      - name: Sign when a Windows certificate secret is present
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT) -or [string]::IsNullOrEmpty($env:CERT_PASSWORD)) {
            Write-Host "Windows signing secrets are not set. Publishing unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "dingai.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PASSWORD dist\win\DingAIWin.exe
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: dingai-windows
          path: dist/win

  release:
    needs: [ubuntu, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dingai-linux/dingai-linux.tar.gz
            dist/dingai-mac/DingAI-mac.zip
            dist/dingai-windows/**
